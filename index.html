<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Scout</title>
<style>
:root{--bg:#f4f7f3;--card:#fff;--ink:#17211b;--muted:#6b756e;--brand:#25643c;--brand2:#e5f1e9;--line:#dfe7e1;--warn:#9a6700;--bad:#a12a2a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:#173f29;color:#fff;padding:18px 16px 14px;z-index:5}header h1{font-size:21px;margin:0}header small{opacity:.8}.wrap{max-width:900px;margin:auto;padding:16px 16px 92px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}.metric b{font-size:27px;display:block}.metric span,.muted{color:var(--muted);font-size:13px}h2{font-size:18px;margin:20px 0 10px}button,.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:650;background:var(--brand);color:white;font-size:15px}.secondary{background:var(--brand2);color:var(--brand)}.danger{background:#fbeaea;color:var(--bad)}input,select,textarea{width:100%;border:1px solid #ccd7cf;border-radius:10px;padding:11px;font-size:16px;background:#fff}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;background:var(--brand2);color:var(--brand);padding:5px 8px;border-radius:999px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}.tabs div{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{background:#fff;color:#536058;border-radius:0;padding:13px 4px}.tabs button.active{color:var(--brand);background:#f4faf6}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.plant{cursor:pointer}.plant strong{display:block}.empty{text-align:center;color:var(--muted);padding:24px}.notice{background:#fff8df;color:#6f5200;padding:10px;border-radius:10px;font-size:13px}.bigtitle{font-size:24px;margin:0 0 4px}.back{background:transparent;color:var(--brand);padding:5px 0;margin-bottom:10px}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.full{grid-column:1/-1}@media(min-width:700px){.grid.metrics{grid-template-columns:repeat(4,1fr)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}}

/* iPhone/file-preview navigation fallback: forms can open even if script clicks are restricted */
.btnlink{display:inline-block;background:var(--green);color:white;text-decoration:none;border-radius:12px;padding:13px 18px;font-weight:700}.btnlink.secondary{background:#e4f1e7;color:#2f6840}.page:target{display:block!important}main:has(#newPlant:target) #home,main:has(#plantings:target) #home,main:has(#detail:target) #home{display:none!important}
</style></head>
<body><header><h1>Field Scout</h1><small>Planting & Crop Tracking · v2.4</small></header><main class="wrap">
<section id="home" class="page"><h2>Mi semana</h2><div class="grid metrics"><div class="card metric"><b id="mActive">0</b><span>Plantings activos</span></div><div class="card metric"><b id="mPending">0</b><span>Scouts pendientes</span></div><div class="card metric"><b id="mHarvest">0</b><span>Próx. cosechas</span></div><div class="card metric"><b id="mScouts">0</b><span>Scouts registrados</span></div></div><div class="actions"><a class="btnlink" href="#newPlant" onclick="showNewPlant()">+ Nuevo Planting</a><a class="btnlink secondary" href="#plantings" onclick="go('plantings')">Ver Plantings</a></div><h2>Próximas cosechas</h2><div id="upcoming"></div></section>
<section id="plantings" class="page hidden"><div class="item"><h2>Plantings</h2><button onclick="showNewPlant()">+ Nuevo</button></div><input id="search" placeholder="Buscar TLC Ref #, rancho, lote..." oninput="renderPlants()"><div class="row" style="margin-top:10px"><select id="filterProduct" onchange="renderPlants()"><option value="">Todos los productos</option><option>Arúgula</option><option>Espinaca</option><option>Cress</option></select><select id="filterStatus" onchange="renderPlants()"><option value="">Todos los estados</option><option>Projected</option><option>Planted</option><option>Growing</option><option>Near Harvest</option><option>Harvested</option><option>Closed</option><option>No Harvest</option></select></div><div id="plantList" style="margin-top:12px"></div></section>
<section id="newPlant" class="page hidden"><button class="back" onclick="go('plantings')">← Plantings</button><h2 class="bigtitle">Nuevo Planting</h2><form id="plantForm" action="#newPlant" class="card formgrid"><div><label>Producto *</label><select name="product" required><option value="">Seleccionar</option><option>Arúgula</option><option>Espinaca</option><option>Cress</option></select></div><div><label>TLC Ref # *</label><input name="ref" required placeholder="Ej. S24506"></div><div><label>Rancho *</label><input name="ranch" required></div><div><label>Lote *</label><input name="lot" required></div><div><label>Variedad</label><input name="variety"></div><div><label>Customer</label><input name="customer"></div><div><label>Acres *</label><input name="acres" type="number" min="0" step="0.01" required></div><div><label>Beds</label><input name="beds" type="number" min="0" step="1"></div><div><label>Proj Wet Date</label><input name="wetDate" type="date"></div><div><label>Proj Clip Days</label><input name="clipDays" type="number" min="0"></div><div><label>Clip Harv. Date</label><input name="harvestDate" type="date"></div><div><label>Estado</label><select name="status"><option>Projected</option><option>Planted</option><option>Growing</option><option>Near Harvest</option></select></div><div class="full" style="margin-top:16px"><button type="button" id="savePlantBtn">Guardar Planting</button></div></form></section>
<section id="detail" class="page hidden"><button class="back" onclick="go('plantings')">← Plantings</button><div id="detailBody"></div></section>
</main><nav class="tabs"><div><button id="tab-home" onclick="go('home')">Inicio</button><button id="tab-plantings" onclick="go('plantings')">Plantings</button><button onclick="showNewPlant()">+ Nuevo</button></div></nav>
<script>
const KEY='fieldScoutV1';let storageOK=true;let db={plants:[]};try{db=JSON.parse(localStorage.getItem(KEY)||'{\"plants\":[]}')}catch(e){storageOK=false;db={plants:[]}}let current=null;const yields={'Arúgula':8500,'Espinaca':10000,'Cress':6000};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOK=false}renderHome();renderPlants();return storageOK}function go(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));let t=document.getElementById('tab-'+id);if(t)t.classList.add('active');if(id==='home')renderHome();if(id==='plantings')renderPlants();scrollTo(0,0)}function showNewPlant(){document.getElementById('plantForm').reset();go('newPlant')}
function fmt(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('es-US',{month:'short',day:'numeric',year:'numeric'})}function expected(p){return Math.round((+p.acres||0)*(yields[p.product]||0))}
function savePlanting(){let form=document.getElementById('plantForm');if(!form.reportValidity())return;let f=Object.fromEntries(new FormData(form));if(db.plants.some(p=>p.ref.trim().toLowerCase()===f.ref.trim().toLowerCase())){alert('Ese TLC Ref # ya existe. Abre el planting existente para conservar su historial.');return}f.id=(crypto&&crypto.randomUUID)?crypto.randomUUID():'p'+Date.now();f.scouts=[];f.harvest=null;db.plants.unshift(f);let persisted=save();openPlant(f.id);if(!persisted){setTimeout(()=>alert('Planting creado para esta sesión. El visor del iPhone no permitió almacenamiento permanente; al publicarlo como web app sí quedará guardado.'),100)}}document.getElementById('savePlantBtn').onclick=savePlanting;document.getElementById('plantForm').onsubmit=e=>{e.preventDefault();savePlanting()};
function renderPlants(){let q=(search?.value||'').toLowerCase(),prod=filterProduct?.value||'',st=filterStatus?.value||'';let a=db.plants.filter(p=>(!prod||p.product===prod)&&(!st||p.status===st)&&(!q||[p.ref,p.ranch,p.lot,p.variety].join(' ').toLowerCase().includes(q)));a.sort((x,y)=>{let done=p=>['Harvested','Closed','No Harvest'].includes(p.status);if(done(x)!==done(y))return done(x)?1:-1;let dx=x.harvestDate?new Date(x.harvestDate+'T12:00:00').getTime():Infinity,dy=y.harvestDate?new Date(y.harvestDate+'T12:00:00').getTime():Infinity;return dx-dy;});plantList.innerHTML=a.length?a.map(p=>`<div class="card plant" onclick="openPlant('${p.id}')"><div class="item"><div><strong>${esc(p.ref)} · ${esc(p.product)}</strong><span class="muted">${esc(p.ranch)} / ${esc(p.lot)} · ${p.acres} ac</span></div><span class="tag">${esc(p.status)}</span></div><div class="muted" style="margin-top:8px">Cosecha proyectada: ${fmt(p.harvestDate)} · Esperado: ${expected(p).toLocaleString()} lb</div></div>`).join(''):'<div class="empty">Todavía no hay plantings.</div>'}
function renderHome(){let active=db.plants.filter(p=>!['Harvested','Closed','No Harvest'].includes(p.status));mActive.textContent=active.length;mScouts.textContent=db.plants.reduce((n,p)=>n+p.scouts.length,0);mPending.textContent=active.filter(p=>p.scouts.length===0||Date.now()-new Date(p.scouts[0]?.date||0).getTime()>4*864e5).length;let now=Date.now(),soon=active.filter(p=>p.harvestDate&&new Date(p.harvestDate+'T12:00:00').getTime()-now<14*864e5&&new Date(p.harvestDate+'T12:00:00').getTime()>=now-864e5);mHarvest.textContent=soon.length;upcoming.innerHTML=soon.length?soon.slice(0,5).map(p=>`<div class="card plant" onclick="openPlant('${p.id}')"><strong>${esc(p.ref)} · ${esc(p.product)}</strong><div class="muted">${esc(p.ranch)} / ${esc(p.lot)} · ${fmt(p.harvestDate)}</div></div>`).join(''):'<div class="card empty">No hay cosechas próximas registradas.</div>'}
  const renderHomeHarvest=renderHome;renderHome=function(){renderHomeHarvest();let active=db.plants.filter(p=>!['Harvested','Closed','No Harvest'].includes(p.status)),today=new Date();today.setHours(0,0,0,0);let soon=active.filter(p=>p.harvestDate).map(p=>{let d=new Date(p.harvestDate+'T12:00:00');d.setHours(0,0,0,0);return{p,days:Math.round((d-today)/864e5)}}).filter(x=>x.days>=0&&x.days<14).sort((a,b)=>a.days-b.days);mHarvest.textContent=soon.length;upcoming.innerHTML=soon.length?soon.map(x=>`<div class="card plant" onclick="openPlant('${x.p.id}')"><strong>${esc(x.p.ref)} · ${esc(x.p.product)}</strong><div class="muted">${esc(x.p.ranch)} / ${esc(x.p.lot)} · ${fmt(x.p.harvestDate)}</div><div style="margin-top:5px;font-weight:650;color:var(--brand)">${x.days===0?'Hoy':x.days===1?'Mañana':'Faltan '+x.days+' días'}</div></div>`).join(''):'<div class="card empty">No hay cosechas próximas registradas.</div>'};
function openPlant(id){current=id;let p=db.plants.find(x=>x.id===id);if(!p)return;go('detail');detailBody.innerHTML=`<div class="item"><div><h2 class="bigtitle">${esc(p.ref)}</h2><div class="muted">${esc(p.product)} · ${esc(p.variety||'Sin variedad')}</div></div><span class="tag">${esc(p.status)}</span></div><div class="card"><div class="row"><div><b>Rancho</b><div>${esc(p.ranch)}</div></div><div><b>Lote</b><div>${esc(p.lot)}</div></div><div><b>Acres</b><div>${p.acres}</div></div><div><b>Beds</b><div>${p.beds||'—'}</div></div>in in<div><b>Customer</b><div>${esc(p.customer||'—')}</div></div><div><b>Proj Clip Days</b><div>${p.clipDays||'—'}</div></div><div><b>Proj Wet Date</b><div>${fmt(p.wetDate)}</div></div><div><b>Proj Harvest</b><div>${fmt(p.harvestDate)}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>Producción esperada</b><div>${expected(p).toLocaleString()} lb (${(yields[p.product]||0).toLocaleString()} lb/acre)</div></div><div class="actions"><a href="#detail" class="btnlink" onclick="scoutForm();return false">+ Nuevo Scout</a><a href="#detail" class="btnlink secondary" onclick="harvestForm();return false">Registrar Cosecha</a></div><h2>Scouts</h2><div id="scouts">${p.scouts.length?p.scouts.map(s=>`<div class="card"><div class="item"><b>${fmt(s.date)}</b><span class="tag">${esc(s.quality||s.condition||'—')}</span></div>${s.size?`<div class="muted" style="margin-top:7px">Tamaño: ${esc(s.size)} in · Población: ${esc(s.population||'—')} · Maleza: ${esc(s.weeds||'—')} · Enfermedad: ${esc(s.disease||'—')}</div>`:''}${(+s.weatherDamagePct||+s.insectDamagePct)?`<div class="muted" style="margin-top:5px">Weather damage: ${+s.weatherDamagePct||0}% · Insect damage: ${+s.insectDamagePct||0}%</div>`:''}<p>${esc(s.observations||'Sin observaciones')}</p>${s.damageNotes?`<div class="muted">Daño/enfermedad: ${esc(s.damageNotes)}</div>`:''}${s.notes?`<div class="muted">${esc(s.notes)}</div>`:''}${s.photos?.length?`<div class="photoGrid">${s.photos.map(ph=>`<img src="${ph}" alt="Foto del scout">`).join('')}</div>`:''}</div>`).join(''):'<div class="card empty">No hay scouts todavía.</div>'}</div>${p.harvest?`<h2>Cosecha</h2><div class="card"><b>${esc(p.harvest.status)}</b><div>${fmt(p.harvest.date)} · ${(+p.harvest.pounds||0).toLocaleString()} lb · ${p.harvest.pallets||0} pallets</div><div class="muted">Rendimiento: ${p.acres?(+p.harvest.pounds/+p.acres).toFixed(0):0} lb/acre · ${expected(p)?((+p.harvest.pounds/expected(p))*100).toFixed(1):0}% de esperado</div></div>`:''}`}
function scoutForm(){let p=db.plants.find(x=>x.id===current);detailBody.innerHTML=`<button class="back" onclick="openPlant('${p.id}')">← Expediente</button><h2 class="bigtitle">Nuevo Scout</h2><div class="muted">${esc(p.ref)} · ${esc(p.product)} · ${esc(p.ranch)} / ${esc(p.lot)}</div><form id="sf" class="card formgrid"><div><label>Fecha del Scout *</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div><label>Tamaño (pulgadas)</label><input name="size" type="number" min="0" step="0.1" placeholder="Ej. 5.5"></div><div><label>Calidad</label><select name="quality"><option>Excelente</option><option selected>Buena</option><option>Regular</option><option>Mala</option></select></div><div><label>Población</label><select name="population"><option>Excelente</option><option selected>Buena</option><option>Regular</option><option>Mala</option></select></div><div><label>Enfermedad</label><select name="disease"><option>Ninguna</option><option>Sospecha</option><option>Presente</option></select></div><div><label>Maleza</label><select name="weeds"><option>Ninguna</option><option>Baja</option><option>Media</option><option>Alta</option></select></div><div class="full"><label>Daños observados</label><div class="row"><label style="font-weight:500"><input style="width:auto" type="checkbox" name="damageType" value="Weather damage"> Weather damage</label><label style="font-weight:500"><input style="width:auto" type="checkbox" name="damageType" value="Insect damage"> Insect damage</label></div></div><div><label>Weather damage (%)</label><input name="weatherDamagePct" type="number" min="0" max="100" step="1" value="0"></div><div><label>Insect damage (%)</label><input name="insectDamagePct" type="number" min="0" max="100" step="1" value="0"></div><div class="full"><label>Descripción de enfermedad / daño</label><textarea name="damageNotes" rows="3" placeholder="Qué observaste, insecto probable, área afectada, etc."></textarea></div><div class="full"><label>Observaciones generales</label><textarea name="observations" rows="4"></textarea></div><div class="full"><label>Notas adicionales</label><textarea name="notes" rows="2"></textarea></div><div class="full"><label>Fotografías del Scout</label><input id="scoutPhotos" name="photos" type="file" accept="image/*" capture="environment" multiple><div class="muted" style="margin-top:6px">Puedes tomar fotos con el iPhone o seleccionarlas de Fotos. Para esta versión de prueba se comprimen y guardan en este dispositivo.</div><div id="photoPreview" class="photoGrid"></div></div><div class="full"><button>Guardar Scout</button></div></form>`;let selectedPhotos=[];document.getElementById('scoutPhotos').onchange=async e=>{selectedPhotos=[];photoPreview.innerHTML='<div class="muted">Procesando fotos…</div>';for(const file of [...e.target.files].slice(0,6)){try{selectedPhotos.push(await compressPhoto(file))}catch(err){}}photoPreview.innerHTML=selectedPhotos.map(ph=>`<img src="${ph}" alt="Vista previa">`).join('')};document.getElementById('sf').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),s=Object.fromEntries(fd);delete s.photos;s.damageTypes=fd.getAll('damageType');delete s.damageType;s.condition=s.quality||'Buena';s.photos=selectedPhotos;try{p.scouts.unshift(s);if(p.status==='Projected'||p.status==='Planted')p.status='Growing';save();openPlant(p.id)}catch(err){p.scouts.shift();alert('No hubo espacio suficiente para guardar las fotos en este prototipo. Prueba con menos fotos.')}}}
function harvestForm(){let p=db.plants.find(x=>x.id===current);detailBody.innerHTML=`<button class="back" onclick="openPlant('${p.id}')">← Expediente</button><h2 class="bigtitle">Registrar Cosecha</h2><form id="hf" class="card"><label>Resultado *</label><select name="status" required><option>Harvested</option><option>Partial</option><option>No Harvest</option></select><label>Fecha</label><input name="date" type="date"><div class="row"><div><label>Libras</label><input name="pounds" type="number" min="0"></div><div><label>Pallets</label><input name="pallets" type="number" min="0"></div></div><label>Customer / para quién</label><input name="customer" value="${esc(p.customer||'')}"><label>Observaciones</label><textarea name="observations" rows="3"></textarea><button style="margin-top:14px">Guardar Cosecha</button></form>`;document.getElementById('hf').onsubmit=e=>{e.preventDefault();p.harvest=Object.fromEntries(new FormData(e.target));p.status=p.harvest.status==='No Harvest'?'No Harvest':p.harvest.status==='Harvested'?'Harvested':'Near Harvest';save();openPlant(p.id)}}
function compressPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))};img.src=r.result};r.readAsDataURL(file)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.addEventListener('DOMContentLoaded',()=>go('home'));
function weekStart(d=new Date()){let x=new Date(d);x.setHours(0,0,0,0);let n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}function trackingOn(p){return typeof p.weeklyScouting==='boolean'?p.weeklyScouting:['Growing','Near Harvest'].includes(p.status)}function scoutsThisWeek(p){let a=weekStart(),b=new Date(a);b.setDate(b.getDate()+7);return(p.scouts||[]).filter(s=>{if(!s.date)return false;let d=new Date(s.date+'T12:00:00');return d>=a&&d<b}).length}function pendingFor(p){return trackingOn(p)?Math.max(0,2-scoutsThisWeek(p)):0}
const oldRenderHome=renderHome;renderHome=function(){oldRenderHome();let active=db.plants.filter(p=>!['Harvested','Closed','No Harvest'].includes(p.status));mPending.textContent=active.reduce((n,p)=>n+pendingFor(p),0);mScouts.textContent=active.reduce((n,p)=>n+scoutsThisWeek(p),0);let lab=document.querySelector('#mScouts+span');if(lab)lab.textContent='Scouts esta semana';let box=document.getElementById('weeklyPending');if(!box){let h=[...document.querySelectorAll('#home h2')].find(x=>x.textContent.includes('Próximas cosechas'));let title=document.createElement('h2');title.textContent='Scouts pendientes';box=document.createElement('div');box.id='weeklyPending';h.parentNode.insertBefore(title,h);h.parentNode.insertBefore(box,h)}let a=active.filter(p=>pendingFor(p)>0).sort((x,y)=>scoutsThisWeek(x)-scoutsThisWeek(y));box.innerHTML=a.length?a.map(p=>`<div class="card plant" onclick="openPlant('${p.id}')"><div class="item"><div><strong>${esc(p.ref)} · ${esc(p.product)}</strong><div class="muted">${esc(p.ranch)} / ${esc(p.lot)}</div></div><span class="tag">${scoutsThisWeek(p)}/2</span></div><div class="muted">Faltan ${pendingFor(p)} scout${pendingFor(p)==1?'':'s'} esta semana</div></div>`).join(''):'<div class="card empty">Todos los seguimientos están al día esta semana.</div>'}
  const oldOpenPlant=openPlant;openPlant=function(id){oldOpenPlant(id);let p=db.plants.find(x=>x.id===id);if(!p)return;let actions=detailBody.querySelector('.actions');if(!actions)return;let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="item"><div><b>Seguimiento semanal</b><div style="margin-top:6px;color:var(--brand);font-size:13px;font-weight:650">Scouts esta semana: ${scoutsThisWeek(p)} de 2</div></div><button class="${trackingOn(p)?'danger':'secondary'}" onclick="toggleWeekly('${p.id}')">${trackingOn(p)?'Pausar seguimiento':'Iniciar seguimiento'}</button></div>`;actions.parentNode.insertBefore(c,actions)};function toggleWeekly(id){let p=db.plants.find(x=>x.id===id);if(!p)return;p.weeklyScouting=!trackingOn(p);save();openPlant(id)}document.querySelector('header small').textContent='Planting & Crop Tracking · v2.5';let fix=document.createElement('style');fix.textContent='.btnlink{background:var(--brand)!important}';document.head.appendChild(fix);
  fix.textContent='.btnlink{background:var(--brand)!important;color:white!important}.btnlink.secondary{background:var(--brand2)!important;color:var(--brand)!important}';
  function harvestsOf(p){if(Array.isArray(p.harvests))return p.harvests;if(p.harvest)return[p.harvest];return[]}function harvestTotals(p){let h=harvestsOf(p);return{pounds:h.reduce((n,x)=>n+(+x.pounds||0),0),pallets:h.reduce((n,x)=>n+(+x.pallets||0),0)}}
  harvestForm=function(){let p=db.plants.find(x=>x.id===current);detailBody.innerHTML=`<button class="back" onclick="openPlant('${p.id}')">← Expediente</button><h2 class="bigtitle">Registrar Cosecha</h2><form id="hf" class="card"><label>Resultado *</label><select name="status" required><option>Partial</option><option>Harvested</option><option>No Harvest</option></select><label>Fecha *</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"><div class="row"><div><label>Libras</label><input name="pounds" type="number" min="0"></div><div><label>Pallets</label><input name="pallets" type="number" min="0"></div></div><label>Customer / para quién</label><input name="customer" value="${esc(p.customer||'')}"><label>Observaciones</label><textarea name="observations" rows="3"></textarea><button style="margin-top:14px">Guardar Cosecha</button></form>`;document.getElementById('hf').onsubmit=e=>{e.preventDefault();let h=Object.fromEntries(new FormData(e.target));if(!Array.isArray(p.harvests))p.harvests=p.harvest?[p.harvest]:[];p.harvests.push(h);p.harvest=h;p.status=h.status==='No Harvest'?'No Harvest':h.status==='Harvested'?'Harvested':'Near Harvest';if(h.status!=='Partial')p.weeklyScouting=false;save();openPlant(p.id)}}
  const openPlantHarvestV26=openPlant;openPlant=function(id){openPlantHarvestV26(id);let p=db.plants.find(x=>x.id===id);if(!p)return;let hs=harvestsOf(p);if(!hs.length)return;let t=harvestTotals(p),exp=expected(p),perAcre=(+p.acres?t.pounds/+p.acres:0),diff=t.pounds-exp,pct=exp?t.pounds/exp*100:0;let box=document.createElement('div');box.innerHTML=`<h2>Resumen de Cosecha</h2><div class="card"><div class="row"><div><b>Total cosechado</b><div>${t.pounds.toLocaleString()} lb</div></div><div><b>Total pallets</b><div>${t.pallets.toLocaleString()}</div></div><div><b>Rendimiento real</b><div>${perAcre.toFixed(0)} lb/acre</div></div><div><b>Producción esperada</b><div>${exp.toLocaleString()} lb</div></div><div><b>Diferencia</b><div>${diff>=0?'+':''}${diff.toLocaleString()} lb</div></div><div><b>% de lo esperado</b><div>${pct.toFixed(1)}%</div></div></div><h3 style="font-size:15px;margin:16px 0 8px">Cosechas registradas</h3>${hs.map(h=>`<div style="padding:9px 0;border-top:1px solid var(--line)"><b>${fmt(h.date)} · ${esc(h.status)}</b><div class="muted">${(+h.pounds||0).toLocaleString()} lb · ${(+h.pallets||0).toLocaleString()} pallets${h.customer?' · '+esc(h.customer):''}</div>${h.observations?`<div style="margin-top:4px">${esc(h.observations)}</div>`:''}</div>`).join('')}</div>`;detailBody.appendChild(box)};document.querySelector('header small').textContent='Planting & Crop Tracking · v2.6';
  const openPlantCleanV26=openPlant;openPlant=function(id){openPlantCleanV26(id);let p=db.plants.find(x=>x.id===id);if(!p||!harvestsOf(p).length)return;let hs=[...detailBody.querySelectorAll('h2')].find(x=>x.textContent.trim()==='Cosecha');if(hs){let c=hs.nextElementSibling;hs.remove();if(c&&c.classList.contains('card'))c.remove()}}
  function showReports(){let ps=db.plants||[],acres=ps.reduce((n,p)=>n+(+p.acres||0),0),done=ps.filter(p=>harvestsOf(p).length),expectedTotal=done.reduce((n,p)=>n+expected(p),0),actualTotal=done.reduce((n,p)=>n+harvestTotals(p).pounds,0),harvestAcres=done.reduce((n,p)=>n+(+p.acres||0),0),avg=harvestAcres?actualTotal/harvestAcres:0;detailBody.innerHTML=`<button class="back" onclick="go('home')">← Inicio</button><h2 class="bigtitle">Reports</h2><div class="card"><div class="row"><div><b>Plantings totales</b><div>${ps.length}</div></div><div><b>Acres totales</b><div>${acres.toFixed(1)}</div></div><div><b>Con cosecha</b><div>${done.length}</div></div><div><b>Rendimiento promedio</b><div>${avg.toFixed(0)} lb/acre</div></div><div><b>Libras esperadas</b><div>${expectedTotal.toLocaleString()}</div></div><div><b>Libras cosechadas</b><div>${actualTotal.toLocaleString()}</div></div></div><h2>Resultados por Planting</h2>${done.length?done.map(p=>{let t=harvestTotals(p),e=expected(p),pct=e?t.pounds/e*100:0;return `<div class="card item" onclick="openPlant('${p.id}')"><div><b>${esc(p.ref||'Sin Ref')} · ${esc(p.product||'')}</b><div class="muted">${esc(p.ranch||'')} / ${esc(p.lot||'')}</div><div>${t.pounds.toLocaleString()} lb · ${(+p.acres||0).toLocaleString()} acres · ${pct.toFixed(1)}% esperado</div></div></div>`}).join(''):`<div class="card muted">Todavía no hay cosechas registradas.</div>`}`;go('detail')}
  let nav=document.querySelector('.tabs div');if(nav){nav.style.gridTemplateColumns='repeat(4,1fr)';let rb=document.createElement('button');rb.textContent='Reports';rb.onclick=showReports;nav.appendChild(rb)}document.querySelector('header small').textContent='Planting & Crop Tracking · v2.7';
  const reportsOriginal=showReports;

showReports=function(){

  let allPlants=db.plants,rf0=window.reportFilters||{from:'',to:'',product:''};db.plants=allPlants.filter(p=>(!rf0.product||p.product===rf0.product)&&(!rf0.from&&!rf0.to||harvestsOf(p).some(h=>(!rf0.from||h.date>=rf0.from)&&(!rf0.to||h.date<=rf0.to))));
  reportsOriginal();
  db.plants=allPlants;

  setTimeout(()=>{

    let title=detailBody.querySelector('.bigtitle');

    if(!title)return;

    let box=document.createElement('div');

    box.className='card';

    box.innerHTML='<b>Filtros</b><div class="formgrid" style="margin-top:12px"><div><label>Desde</label><input id="repFrom" type="date"></div><div><label>Hasta</label><input id="repTo" type="date"></div><div class="full"><label>Producto</label><select id="repProduct"><option value="">Todos</option><option>Arúgula</option><option>Espinaca</option><option>Cress</option></select></div></div>';

    title.after(box);
    let clear=document.createElement('button');clear.textContent='Limpiar filtros';clear.style.marginTop='12px';clear.onclick=()=>{window.reportFilters={from:'',to:'',product:''};showReports()};box.appendChild(clear);
    let rf=window.reportFilters||(window.reportFilters={from:'',to:'',product:''});repFrom.value=rf.from;repTo.value=rf.to;repProduct.value=rf.product;[repFrom,repTo,repProduct].forEach(x=>x.onchange=()=>{rf.from=repFrom.value;rf.to=repTo.value;rf.product=repProduct.value;showReports()});
    

  },100);

};
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.textContent.trim()==='Reports')b.onclick=showReports});
  
  
  

document.querySelector('header small').textContent='Planting & Crop Tracking · v2.8';
  
  
  
  
  
</script></body></html>
